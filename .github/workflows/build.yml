# Pushing a tag like v2.0 builds and tests Linux and Windows, then publishes
# the source tarball and the Windows installer as a GitHub release.
# "Run workflow" on the Actions page builds and tests only.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  QT_VERSION: '6.10.3'

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev libxkbcommon-dev ffmpeg
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      # The app must start with an empty log and set up yt-dlp by itself
      - name: Start-up test
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/data" XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          export QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1
          timeout -s INT 90 build/appYeetDownloader > "$RUNNER_TEMP/startup.log" 2>&1 || true
          cat "$RUNNER_TEMP/startup.log"
          test -x "$XDG_DATA_HOME/YeetDownloader/yt-dlp" || { echo "::error::yt-dlp was not set up"; exit 1; }
          test ! -s "$RUNNER_TEMP/startup.log" || { echo "::error::The start-up log is not empty"; exit 1; }
      - name: Source tarball
        run: git archive --format=tar --prefix=YeetDownloader/ HEAD | xz -9 > YeetDownloader-source.tar.xz
      - uses: actions/upload-artifact@v6
        with:
          name: YeetDownloader-source
          path: YeetDownloader-source.tar.xz

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Microsoft's compiler: its environment (vcvars64.bat) for the steps after this one
      - name: Microsoft's compiler
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error "Visual Studio's C++ tools not found"; exit 1 }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          cmake --build build
      - name: App folder (app, Qt, Microsoft's C++ runtime)
        shell: bash
        run: |
          dist=dist/YeetDownloader
          mkdir -p "$dist"
          cp build/YeetDownloader.exe "$dist"/
          windeployqt --release --qmldir frontend --no-translations --no-compiler-runtime "$dist/YeetDownloader.exe"
          # Not for users: QML debugging plugins; Windows' own ICU (every Windows 10 / 11 has it)
          rm -rf "$dist/qmltooling" "$dist/icuuc.dll" "$dist/icuin.dll"
          cp "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC*.CRT/*.dll "$dist"/
          printf '[Paths]\nPrefix = .\nPlugins = .\nQmlImports = qml\n' > "$dist/qt.conf"
      # The packaged app must start on a real Windows with an empty log and
      # set up yt-dlp by itself
      - name: Start-up test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "startup.log"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $app = Start-Process dist/YeetDownloader/YeetDownloader.exe -PassThru -RedirectStandardError $log
          $ytdlp = Join-Path $env:LOCALAPPDATA "YeetDownloader\yt-dlp.exe"
          for ($i = 0; $i -lt 90 -and -not (Test-Path $ytdlp); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 10
          $exited = $app.HasExited
          if (-not $exited) { Stop-Process -Id $app.Id -Force }
          Get-Content $log
          if ($exited) { Write-Error "The app quit at start (exit code $($app.ExitCode))"; exit 1 }
          if (-not (Test-Path $ytdlp)) { Write-Error "yt-dlp.exe was not set up"; exit 1 }
          if ((Get-Item $log).Length -gt 0) { Write-Error "The start-up log is not empty"; exit 1 }
          & $ytdlp --version
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(YeetDownloader VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\dist\YeetDownloader" "/DOutputDir=$PWD\installer" release\windows\YeetDownloader.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem installer
      - uses: actions/upload-artifact@v6
        with:
          name: YeetDownloader-windows-setup
          path: installer/*.exe

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the app's version
        run: |
          version=$(sed -n 's/^project(YeetDownloader VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in CMakeLists.txt"
              exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "YeetDownloader $GITHUB_REF_NAME" --generate-notes
